name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - name: Emit outcome signal
        if: always()
        env:
          SOVEREIGN_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run ci:signal -- "${{ job.status }}"
      - name: Upload outcome signal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-outcome-${{ github.run_id }}
          path: .sovereign/ci-signal.json
          if-no-files-found: error
